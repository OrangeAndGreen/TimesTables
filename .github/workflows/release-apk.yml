# Builds a signed release APK on every push to master and publishes it as a
# GitHub release, which Obtainium on the phone watches for updates.
name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so the release notes can list every commit
          # since the previous v* release, not just the one pushed.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"


      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :domain:test :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${CI_BUILD_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk timestables.apk
          gh release create "$tag" timestables.apk \
            --target "$GITHUB_SHA" \
            --title "Times Tables $tag" \
            --notes "$(bash .github/scripts/release-notes.sh "$GITHUB_SHA")" \
            --latest
